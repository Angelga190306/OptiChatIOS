name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node modules
        run: npm ci

      - name: Setup Ruby (for Cocoapods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Cocoapods
        working-directory: ios
        run: pod install

      - name: Build iOS App (Unsigned)
        working-directory: ios
        run: |
          xcodebuild -workspace OptiChatIOS.xcworkspace \
            -scheme OptiChatIOS \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Debug-iphoneos/OptiChatIOS.app Payload/
          zip -r app.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
          retention-days: 1
